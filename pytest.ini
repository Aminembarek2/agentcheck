# Harness test configuration.
#
# `norecursedirs` matters: target/ and target002/ are checkouts of the
# repositories under test. Collecting them runs THEIR suites — one of which
# calls sys.exit(1) at import — which has nothing to do with this harness.
[pytest]
testpaths = tests
norecursedirs = target* .venv .git tasks runs __pycache__ *.egg-info
markers =
    container: needs Docker and a built task image (slow)
